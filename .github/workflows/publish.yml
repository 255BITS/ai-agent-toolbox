name: Publish to PyPI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build and test distributions
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      version: ${{ steps.registry.outputs.version }}
      publish: ${{ steps.registry.outputs.publish }}
      source_version: ${{ steps.source.outputs.version }}
      source_prerelease: ${{ steps.source.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build, check and test distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
          wheels=(dist/*.whl)
          python -m pip install "${wheels[0]}[dev]"
          python -m pytest
          python benchmarks/parsing.py
      - name: Check the version change for GitHub Releases
        id: source
        env:
          BEFORE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: python .github/scripts/publish_source.py qualify --package ai-agent-toolbox >> "$GITHUB_OUTPUT"
      - name: Check the exact version on PyPI
        id: registry
        if: github.repository == '255BITS/ai-agent-toolbox' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          version="$(python -c 'from importlib.metadata import version; print(version("ai-agent-toolbox"))')"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          status="$(curl --silent --show-error --retry 2 --max-time 30 \
            --output /dev/null --write-out '%{http_code}' \
            "https://pypi.org/pypi/ai-agent-toolbox/$version/json")"
          case "$status" in
            200) echo "ai-agent-toolbox $version already exists on PyPI" ;;
            404) echo 'publish=true' >> "$GITHUB_OUTPUT" ;;
            *) echo "PyPI version lookup returned HTTP $status" >&2; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v4
        if: steps.registry.outputs.publish == 'true'
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish tested distributions
    if: needs.package.outputs.publish == 'true'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pypi-${{ needs.package.outputs.version }}
      cancel-in-progress: false
    environment:
      name: pypi
      url: https://pypi.org/project/ai-agent-toolbox/${{ needs.package.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github-source:
    name: Publish tested GitHub source release
    needs: package
    if: ${{ github.repository == '255BITS/ai-agent-toolbox' && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.package.outputs.source_version != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: github-source-${{ needs.package.outputs.source_version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Tag and release the tested source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_VERSION: ${{ needs.package.outputs.source_version }}
          SOURCE_PRERELEASE: ${{ needs.package.outputs.source_prerelease }}
        run: |
          python .github/scripts/publish_source.py publish --repository 255BITS/ai-agent-toolbox             --version "$SOURCE_VERSION" --prerelease "$SOURCE_PRERELEASE"
